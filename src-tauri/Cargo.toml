[package]
name = "tsi-desktop"
version = "0.1.0"
description = "Tsi 助手 macOS 桌面宿主"
authors = ["Tsi contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
